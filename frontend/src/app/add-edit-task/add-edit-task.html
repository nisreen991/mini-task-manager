<div class="task-form-container">
  <h2>{{ isEditMode ? 'Edit Task' : 'Add New Task' }}</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="title">Title:</label>
      <input type="text" id="title" name="title" [(ngModel)]="task.title" required>
    </div>
    <div class="form-group">
      <label for="description">Description:</label>
      <textarea id="description" name="description" [(ngModel)]="task.description" rows="4"></textarea>
    </div>
    <div class="form-group checkbox-group">
      <input type="checkbox" id="completed" name="completed" [(ngModel)]="task.completed">
      <label for="completed">Completed</label>
    </div>
    <div class="form-actions">
      <button type="submit" class="save-btn">{{ isEditMode ? 'Update Task' : 'Create Task' }}</button>
      <button type="button" class="cancel-btn" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>
