<div class="tasks-container">
  <h2>Your Tasks</h2>
  <button class="add-task-btn" (click)="addNewTask()">Add New Task</button>

  <div *ngIf="tasks.length === 0; else tasksList">
    <p>No tasks found. Start by adding a new task!</p>
  </div>

  <ng-template #tasksList>
    <ul class="task-list">
      <li *ngFor="let task of tasks" [class.completed]="task.completed">
        <div class="task-info">
          <h3 (click)="toggleComplete(task)">{{ task.title }}</h3>
          <p>{{ task.description }}</p>
        </div>
        <div class="task-actions">
          <button class="edit-btn" (click)="editTask(task.id!)">Edit</button>
          <button class="delete-btn" (click)="deleteTask(task.id!)">Delete</button>
        </div>
      </li>
    </ul>
  </ng-template>
</div>
